name: magento_notification

x-magento-env: &magento-env
  MAGENTO_VERSION: ${MAGENTO_VERSION:-2.4.8-p5}
  MAGENTO_BASE_URL: http://${MAGENTO_HOST:-localhost}:${HTTP_PORT:-8080}/
  MAGENTO_ADMIN_FRONTNAME: ${MAGENTO_ADMIN_FRONTNAME:-admin}
  MAGENTO_ADMIN_USER: ${MAGENTO_ADMIN_USER:-admin}
  MAGENTO_ADMIN_PASSWORD: ${MAGENTO_ADMIN_PASSWORD:-Admin@12345}
  MAGENTO_ADMIN_EMAIL: ${MAGENTO_ADMIN_EMAIL:-admin@example.com}
  MAGENTO_CUSTOMER_EMAIL: ${MAGENTO_CUSTOMER_EMAIL:-cliente@example.com}
  MAGENTO_CUSTOMER_PASSWORD: ${MAGENTO_CUSTOMER_PASSWORD:-Cliente@12345}
  MAGENTO_LOCALE: ${MAGENTO_LOCALE:-pt_BR}
  MAGENTO_CURRENCY: ${MAGENTO_CURRENCY:-BRL}
  MAGENTO_TIMEZONE: ${MAGENTO_TIMEZONE:-America/Sao_Paulo}
  DB_HOST: db
  DB_NAME: ${DB_NAME:-magento}
  DB_USER: ${DB_USER:-magento}
  DB_PASSWORD: ${DB_PASSWORD:-magento}
  OPENSEARCH_HOST: opensearch
  OPENSEARCH_PORT: 9200

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME:-magento}
      MARIADB_USER: ${DB_USER:-magento}
      MARIADB_PASSWORD: ${DB_PASSWORD:-magento}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    command:
      - --max_allowed_packet=64M
      - --innodb_buffer_pool_size=512M
      - --log_bin_trust_function_creators=1
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "false"
      node.store.allow_mmap: "false"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9200' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  setup:
    build: &php-build
      context: ./docker/php
    image: magento_notification/php:8.3
    command: ["magento-setup"]
    environment:
      <<: *magento-env
    volumes: &magento-volumes
      - magento-code:/var/www/html
      - ./src/app/code:/var/www/html/app/code
      - composer-cache:/var/www/.composer/cache
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    restart: "no"

  php:
    build: *php-build
    image: magento_notification/php:8.3
    environment:
      <<: *magento-env
    volumes: *magento-volumes
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    image: nginx:1.28
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - magento-code:/var/www/html:ro
      - ./src/app/code:/var/www/html/app/code:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  opensearch-data:
  magento-code:
  composer-cache:
