# Usa a configuração oficial que acompanha o Magento (nginx.conf.sample),
# disponível no volume após a instalação feita pelo serviço "setup".
upstream fastcgi_backend {
    server php:9000;
}

server {
    listen 80;
    server_name _;

    set $MAGE_ROOT /var/www/html;
    set $MAGE_DEBUG_SHOW_ARGS 0;

    include /var/www/html/nginx.conf.sample;
}
